# GitHub Pages configuration for the secure-development-standards site.
#
# Publishing source is /docs on the default branch, which makes THIS directory the Jekyll source
# root. Every file the site needs -- _config.yml, _data, _layouts, assets, index.md -- has to live
# under docs/. A _config.yml at the repository root would be ignored, and the build would still go
# green, so treat the location of this file as load-bearing.

title: Secure development standards
description: >-
  Security standards you can adopt or fork: secure development, AI-assisted development, code
  quality, dependency integrity, human review depth, and what to ask a software vendor for.

# baseurl is NOT derived from the repository name by the GitHub Pages build. It has to be set here,
# and everything depends on it: jekyll-relative-links rewrites the intra-docs links through
# relative_url, which prepends this value, and the layout builds every nav href and the stylesheet
# href from it. Wrong or missing means the pages still render and every link and asset 404s.
# MOVED OFF GITHUB PAGES 2026-08-10. Corporate networks that block github.com commonly block
# *.github.io under the same category rule, and this readership's does, so the published site was
# unreachable for the audience it is written for. Cloudflare Pages serves from a project root, so
# baseurl is now empty where it used to carry the repository name.
#
# THE HOST IS REPEATED IN THE DOCUMENTS, which is the known cost of this arrangement. Every "Take a
# copy" line writes this host absolutely, because jekyll-relative-links rewrites a relative
# `](FILE.md)` to the RENDERED PAGE and the whole point of those links is the raw file. Changing the
# host therefore means changing it here AND in every document, in one commit.
#
# *.pages.dev IS ANOTHER SHARED FREE SUBDOMAIN, and the same category rule that caught github.io can
# catch it. It was chosen with that known. A domain you control is the durable answer, and moving to
# one is this line plus a find-and-replace, not another migration.
#
# tests/test_internal_links_resolve.py READS THESE TWO VALUES rather than copying them, and reds if
# the documents stop agreeing with them.
url: https://secure-development-standards.pages.dev
baseurl: ""

# Used by the layout instead of site.github.*, which is empty in a local build without a token and
# populated in production -- an instrument that answers a different question depending on where it
# runs.
repo_url: https://github.com/wshallwshall/secure-development-standards

markdown: kramdown

# No `plugins:` key on purpose.
#
# GitHub Pages runs in safe mode with a fixed plugin allowlist, and three of the defaults are what
# make this site work without touching the 14 documents:
#   jekyll-optional-front-matter  turns each front-matter-less .md into a rendered page
#   jekyll-relative-links         rewrites ](CONCEPTS.md) to the built URL, with baseurl
#   jekyll-titles-from-headings   sets page.title from the leading H1
# Those cannot be disabled and need no configuration. A plugin that is not on the allowlist is not
# an error either -- it simply never runs, which is the failure mode that looks like success.

# No `exclude:` key on purpose. Setting it REPLACES Jekyll's defaults rather than adding to them,
# and there is nothing under docs/ that should not be served.

# One layout for every page, applied through front-matter defaults so that the 14 existing
# documents keep zero front matter.
#
# TWO MECHANISMS ARE IN PLAY HERE, and the honest description is that they cannot be made to
# disagree rather than that only one runs. jekyll-default-layout is a default plugin and cannot be
# disabled; whether it also assigns a layout to these pages depends on whether its skip test
# consults the lazy front-matter-defaults lookup that Jekyll installs on a page's data hash, which
# is not observable from this repository. So the site is built so that BOTH paths land in the same
# place: this defaults block resolves `layout: default` directly, and _layouts/page.html -- the
# layout jekyll-default-layout would pick for a non-index page -- is a one-line wrapper that chains
# into `default`. Shipping that wrapper is also what removes the dependency on the active theme
# happening to supply an equivalent one.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
