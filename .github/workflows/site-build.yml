# Build the site, say what happened, and -- since 2026-08-10 -- deploy it to Cloudflare Pages.
#
# THE "IT DOES NOT DEPLOY ANYTHING" HEADER THAT USED TO SIT HERE IS GONE, deliberately and in the
# same commit that made it false. A comment describing the opposite of what the file does is the
# defect this repository keeps finding in other people's CI, and the version of it that survives
# longest is the one that was true when written.
#
# WHY THIS FILE IS NOW THE LIVE PATH. github.io is blocked by the readership's corporate network
# under the same category rule that blocks github.com, so GitHub Pages could not serve the audience
# these documents are written for. The site moved to Cloudflare Pages. The build below is unchanged
# and is still the instrument described further down; deployment was added beneath it rather than
# replacing it, so the log survives the move.
#
# WHY THIS FILE EXISTS. GitHub Pages builds this site from `main` `/docs` today, and its only
# diagnostic is the string "Page build failed." with no line, no file and no log. On 2026-08-06 ten
# consecutive builds failed that way over three hours while the pushes all looked successful: the
# repository was green, the commits were correct, and the site silently stopped updating. The cause
# was a rate limit on the legacy builder, not the content -- but nothing on the machine could tell
# the difference, because the only instrument reported one bit.
#
# A build system whose sole output is "it failed" is the exact defect the documents in this repo are
# about. This workflow replaces one bit with a log.
#
# WHAT CHANGED WHEN IT BECAME THE LIVE PATH. It can now break the published site, which the earlier
# version explicitly could not. Two things bound that:
#   * Deployment runs only on `main`, never on a pull request. A PR still gets the build and the log
#     and touches nothing published.
#   * The deploy step FAILS LOUDLY when its credentials are absent rather than skipping. A skipped
#     deploy prints green beside the passes and reads as a site that updated, which is the exact
#     failure mode the paragraph above says this file exists to end.
#
# WHY THAT ORDER. The site depends on plugins that GitHub's safe mode supplies unconditionally. Under
# a build we control they come from the Gemfile instead, and a plugin that is not declared does not
# error -- it just does not run, and the symptom is fourteen documents quietly losing their titles or
# their internal links. So the artifact this uploads exists to be COMPARED against the live pages
# before anyone changes where the site is served from. See the Gemfile for the full argument.

name: site-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. This reads the repository and writes an artifact; it touches no Pages settings
# and needs no `pages:` or `id-token:` permission precisely because it does not deploy.
permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # The project name lives here ONCE and is used by every step that needs it. It also determines
    # the published host, which docs/_config.yml writes into every page -- so the two can disagree,
    # and a step below asserts they do not rather than leaving it to a reader.
    env:
      PAGES_PROJECT: secure-development-standards

    steps:
      # Pinned to a commit, matching gates.yml. A tag is a moving target and this file's whole
      # purpose is telling you what actually ran.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Ruby comes from the Gemfile's own resolution rather than a version pinned here, so there is
      # one place that decides the toolchain. bundler-cache writes and restores Gemfile.lock, which
      # is why no lock file is committed yet: the first green run is what produces a trustworthy one.
      - uses: ruby/setup-ruby@a2bbe5b1b236842c1cb7dd11e8e3b51e0a616acc
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build the site
        run: |
          set -o pipefail
          bundle exec jekyll build \
            --source docs \
            --destination _site \
            --trace 2>&1 | tee build.log

      # THE POINT OF THE WHOLE FILE. A build that "succeeded" while emitting warnings about missing
      # plugins or unresolvable links is the failure that looks like success, so the log is surfaced
      # rather than left in a collapsed step nobody opens.
      - name: Report warnings, if any
        if: always()
        run: |
          echo "=== warnings and errors in the build log ==="
          grep -inE "warn|error|deprecat|cannot|missing|invalid" build.log || echo "  none"

      - name: What was actually produced
        if: always()
        run: |
          echo "=== pages generated ==="
          find _site -name '*.html' | sort | sed 's/^/  /'
          echo "  total: $(find _site -name '*.html' | wc -l) html files"

      # Uploaded so the output can be DIFFED against the live site before anyone considers changing
      # where the site is served from. That comparison is the gate on migrating, not this run's colour.
      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-${{ github.sha }}
          path: _site
          retention-days: 7

      # DEPLOY. `main` only -- a pull request builds and reports and publishes nothing.
      #
      # The credential check is its own step and it EXITS 1. GitHub renders a missing secret as an
      # empty string, so without this the wrangler call would run with no account and either fail
      # with a message about the wrong thing or, worse, be skipped by a condition and print green.
      # "Not configured" and "deployed" must not share a colour.
      - name: Refuse to deploy without credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::cannot deploy; missing repository secret(s):$missing"
            echo "The site is served from Cloudflare Pages. Create the project and a token with the"
            echo "Cloudflare Pages:Edit permission, then add both secrets to this repository."
            echo "This step fails rather than skipping, because a skipped deploy reads as a"
            echo "successful one and the published site would silently stop updating."
            exit 1
          fi
          echo "both credentials present"

      # THE MISMATCH NOTHING COULD CHECK, NOW CHECKED. The project name produces the published host,
      # and docs/_config.yml writes that host into every page and every download link. Cloudflare
      # will happily accept a deploy to a project whose name no document points at, and the result
      # is a site that publishes perfectly and that every link misses.
      - name: The project name and the published host agree
        run: |
          set -o pipefail
          configured=$(sed -nE 's#^url:[ \t]*"?([^"]*)"?[ \t]*$#\1#p' docs/_config.yml | head -1)
          expected="https://${PAGES_PROJECT}.pages.dev"
          echo "docs/_config.yml url : $configured"
          echo "from PAGES_PROJECT   : $expected"
          if [ "$configured" != "$expected" ]; then
            echo "::error::docs/_config.yml publishes '$configured' but this workflow deploys to"
            echo "'$expected'. One of the two is wrong. Every download link in the documents is"
            echo "written against the config value, so a deploy to the other name serves a site"
            echo "nothing links to."
            exit 1
          fi
          echo "they agree"

      # CREATING THE PROJECT HERE RATHER THAN IN THE DASHBOARD. Cloudflare's newer console steers new
      # accounts toward Workers static assets and may not offer to create a Pages project at all --
      # and a Workers app is not something `pages deploy` can target, though it looks equivalent from
      # the dashboard. Doing it here also means the name comes from one place.
      #
      # The probe distinguishes "absent" from "not allowed". A 404 and a 403 both mean "no project
      # visible", and treating them the same would create-on-403 forever while reporting a token
      # problem as a missing project.
      - name: Ensure the Pages project exists
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          code=$(curl -sS -o /tmp/pages-probe.json -w '%{http_code}' \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api")
          echo "probe of project '${PAGES_PROJECT}': HTTP $code"
          case "$code" in
            200)
              echo "it already exists; creating nothing"
              ;;
            404)
              echo "it does not exist; creating it"
              npx --yes wrangler@4 pages project create "${PAGES_PROJECT}" --production-branch=main
              ;;
            401|403)
              echo "::error::the API token was rejected (HTTP $code). It needs the"
              echo "Account -> Cloudflare Pages -> Edit permission, on this account."
              exit 1
              ;;
            *)
              echo "::error::unexpected HTTP $code from the Pages API; refusing to guess what it means."
              cat /tmp/pages-probe.json || true
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # v4.0.0, resolved from the tag rather than typed. Pinned to the commit for the reason
        # gates.yml gives: a tag is a moving target and this file's purpose is saying what ran.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ env.PAGES_PROJECT }}

      - name: What the site now serves
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "deployed to https://${PAGES_PROJECT}.pages.dev"
          echo "pages: $(find _site -name '*.html' | wc -l), raw markdown: $(find _site -name '*.md' | wc -l), word: $(find _site -name '*.docx' | wc -l)"
